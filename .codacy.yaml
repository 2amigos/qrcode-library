---
# Codacy configuration.
#
# PHP code quality is enforced in this project's own CI (GitHub Actions, PHP 8.3/8.4/8.5)
# via php-cs-fixer, PHPStan and a tuned PHPMD ruleset (phpmd.xml). The paths below are
# excluded from Codacy to avoid low-value/duplicate reporting:
#   - tests / vendor: not product code.
#   - markdown (*.md): project prose (README, CHANGELOG, upgrade & docs guides) is written
#     and reviewed by hand; markdownlint's 80-column/whitespace nits are noise here.
exclude_paths:
  - 'tests/**'
  - 'vendor/**'
  - 'docs/**'
  - '*.md'
  - '**/*.md'
